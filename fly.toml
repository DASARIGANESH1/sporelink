# SporeLink — Fly.io Deployment Configuration
# https://fly.io/docs/reference/configuration/

app = "sporelink"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[[services]]
  internal_port = 8000
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.http_checks]
    interval = 30000
    timeout = 5000
    grace_period = "10s"
    method = "get"
    path = "/health"
