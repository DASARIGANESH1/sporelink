# SporeLink CI/CD Pipeline
#
# Trigger: push to main, or pull request against main.
#
# Pipeline flow:
#   Lint ──┐
#   Test ──┼──→ Docker Build → Trivy Scan → Push to GHCR → Deploy → Health
#   IaC  ──┘
#
# Each stage gates the next. Failures stop the pipeline.
# No continue-on-error is used.

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -----------------------------------------------------------
  # Stage 1: Lint
  # -----------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.9.4
      - name: ruff check
        run: ruff check app/ tests/
      - name: ruff format
        run: ruff format --check app/ tests/

  # -----------------------------------------------------------
  # Stage 2: Unit Tests
  # -----------------------------------------------------------
  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v --tb=short

  # -----------------------------------------------------------
  # Stage 3: Terraform Validation
  # -----------------------------------------------------------
  terraform-validate:
    name: IaC Validate (terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"
      - name: terraform fmt
        run: terraform fmt -check terraform/
      - name: terraform init
        run: cd terraform && terraform init -backend=false
      - name: terraform validate
        run: cd terraform && terraform validate

  # -----------------------------------------------------------
  # Stage 4: Docker Build + Trivy Scan + Push to GHCR
  # -----------------------------------------------------------
  docker-build:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    needs: [lint, test, terraform-validate]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 1: Build the image and load it locally with a predictable tag
      - name: Build Docker image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sporelink:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 2: Scan the exact image we just built
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'sporelink:test'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'table'

      # Step 3: Tag with immutable SHA and branch name, then push
      - name: Tag and push to GHCR
        run: |
          docker tag sporelink:test ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag sporelink:test ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main

  # -----------------------------------------------------------
  # Stage 5: Deploy to Fly.io
  # -----------------------------------------------------------
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # -----------------------------------------------------------
  # Stage 6: Post-Deploy Health Verification
  # -----------------------------------------------------------
  health-verify:
    name: Health Verification
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Wait for deployment
        run: sleep 30
      - name: Verify /health
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ vars.FLY_APP_HOSTNAME }}/health")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: /health returned $HTTP_CODE (expected 200)"
            exit 1
          fi
          echo "Health check passed: HTTP $HTTP_CODE"
